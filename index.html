<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Schedule Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Yellowtail&family=Saira+Condensed:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#ffffff;
    --bg-1:#f5f6fa;
    --bg-2:#ffffff;
    --pink:#db2777;
    --pink-soft:#be185d;
    --lilac:#7c3aed;
    --ink:#14162b;
    --ink-dim:#475569;
    --ink-faint:#64748b;
    --line:rgba(15,23,42,0.12);
    --glow: 0 6px 22px rgba(219,39,119,0.20), 0 2px 10px rgba(124,58,237,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(219,39,119,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(124,58,237,0.05), transparent 55%),
      var(--bg-0);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  ::selection{background:var(--pink); color:#ffffff;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:40;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.82);
    border-bottom:1px solid var(--line);
  }
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1120px; margin:0 auto;}
  .word{font-family:'Unbounded',sans-serif; font-weight:800; letter-spacing:0.18em; font-size:15px; color:var(--ink);}
  .navlinks{display:flex; align-items:center; gap:22px;}
  .navlinks button{
    background:none; border:none; color:var(--ink-dim); font-family:'Manrope';
    font-size:14px; font-weight:600; cursor:pointer; padding:6px 2px; border-bottom:2px solid transparent;
  }
  .navlinks button.active, .navlinks button:hover{color:var(--ink); border-color:var(--pink);}

  .bell-btn{
    position:relative; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:rgba(15,23,42,0.03);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink);
  }
  .bell-btn:hover{border-color:var(--pink);}
  .bell-dot{
    position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%;
    background:var(--pink); box-shadow:0 0 6px rgba(219,39,119,0.6);
  }
  .bell-panel{
    position:absolute; right:24px; top:64px; width:330px; max-width:calc(100vw - 32px);
    background:var(--bg-2); border:1px solid var(--line); border-radius:16px;
    padding:14px; box-shadow:0 20px 50px rgba(15,23,42,0.16); display:none; z-index:50;
  }
  .bell-panel.open{display:block;}
  .bell-panel h4{margin:2px 6px 10px; font-size:13px; letter-spacing:0.08em; color:var(--ink-faint); font-weight:700; text-transform:uppercase;}
  .bell-item{padding:10px 8px; border-radius:10px; display:flex; gap:10px; align-items:flex-start;}
  .bell-item:hover{background:rgba(15,23,42,0.05);}
  .bell-date{
    flex:none; width:44px; text-align:center; font-family:'Unbounded'; font-weight:600;
    color:var(--pink-soft); font-size:12px; line-height:1.2; padding-top:2px;
  }
  .bell-date b{display:block; font-size:18px; color:var(--ink);}
  .bell-title{font-size:13.5px; font-weight:600; line-height:1.3; color:var(--ink);}
  .bell-meta{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .bell-empty{padding:16px 8px; color:var(--ink-faint); font-size:13px;}

  /* ---------- HERO ---------- */
  .hero{padding:64px 24px 28px; text-align:center; position:relative;}
  .eyebrow{font-size:13px; color:var(--ink-faint); letter-spacing:0.14em; margin-bottom:6px;}
  .hero h1{
    font-family:'Unbounded', sans-serif; font-weight:800; font-size:clamp(28px,6vw,46px);
    letter-spacing:0.08em; margin:0; color:var(--ink);
  }
  .hero .script{
    display:block; font-family:'Yellowtail', cursive; font-weight:400;
    font-size:clamp(48px,11vw,96px); color:var(--pink);
    text-shadow:var(--glow); line-height:1; margin-top:-6px;
  }
  .metal-bar{
    width:130px; height:4px; margin:16px auto 0; border-radius:3px;
    background:linear-gradient(90deg, #93c5fd, #2563eb, #93c5fd);
    box-shadow:0 2px 10px rgba(37,99,235,0.35);
  }
  .hero p.sub{color:var(--ink-dim); max-width:480px; margin:18px auto 0; font-size:15px; line-height:1.6;}

  .next-chip{
    display:inline-flex; align-items:center; gap:12px; margin-top:26px;
    background:linear-gradient(90deg, rgba(219,39,119,0.08), rgba(124,58,237,0.06));
    border:1px solid rgba(219,39,119,0.30); padding:10px 18px 10px 14px; border-radius:999px;
    font-size:13.5px; color:var(--ink-dim);
  }
  .next-chip .pulse{width:8px; height:8px; border-radius:50%; background:var(--c,var(--pink)); box-shadow:0 0 8px var(--c,var(--pink)); flex:none;
    animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .next-chip b{color:var(--ink); font-weight:700;}
  .next-chip .cd{color:var(--ink-faint);}

  /* ---------- GROUP TABS ---------- */
  .group-bar{
    max-width:1120px; margin:0 auto; padding:0 24px 8px; display:flex; gap:8px;
    flex-wrap:wrap; justify-content:center;
  }
  .grp-pill{
    display:flex; align-items:center; gap:7px; padding:8px 15px; border-radius:999px;
    border:1px solid var(--line); background:rgba(15,23,42,0.02); cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-dim); transition:border-color .15s, background .15s, color .15s;
  }
  .grp-pill .sw{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 6px var(--c); flex:none;}
  .grp-pill:hover{color:var(--ink); border-color:rgba(15,23,42,0.25);}
  .grp-pill.active{
    color:var(--ink); border-color:var(--c); background:rgba(15,23,42,0.04);
    box-shadow:0 0 0 1px var(--c) inset;
  }

  /* ---------- TODAY CARD ---------- */
  section{padding:32px 24px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; max-width:1120px; margin-left:auto; margin-right:auto;}
  .section-head h2{font-family:'Unbounded'; font-size:15px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink); margin:0; font-weight:600;}
  .section-head span{color:var(--ink-faint); font-size:13px;}

  .today-card{
    max-width:1120px; margin:0 auto; border:1px solid var(--line); border-radius:20px;
    padding:22px 24px; background:linear-gradient(160deg, rgba(219,39,119,0.05), var(--bg-1));
  }
  .today-empty{color:var(--ink-faint); font-size:14px;}
  .event-row{display:flex; gap:16px; padding:12px 0; border-top:1px solid var(--line);}
  .event-row:first-child{border-top:none;}
  .event-time{flex:none; width:56px; font-family:'Unbounded'; font-size:12.5px; color:var(--lilac); padding-top:2px; font-weight:600;}
  .event-body h4{margin:0 0 4px; font-size:15px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:8px; color:var(--ink);}
  .event-body p{margin:0; font-size:13px; color:var(--ink-dim); line-height:1.5;}
  .new-tag{
    display:inline-block; font-size:10px; font-weight:700; color:#ffffff; background:var(--pink);
    padding:2px 7px; border-radius:6px; letter-spacing:0.03em;
  }
  .grp-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    color:var(--c); border:1px solid var(--c); padding:2px 8px 2px 6px; border-radius:999px;
  }
  .grp-tag .sw{width:7px; height:7px; border-radius:50%; background:var(--c);}

  /* ---------- CALENDAR + PANEL ---------- */
.cal-layout{max-width:1120px; margin:0 auto; display:grid; grid-template-columns:1.35fr 1fr; gap:24px; align-items:start;}
  @media (max-width:820px){.cal-layout{grid-template-columns:1fr;}}
 
  .cal-card{border:1px solid var(--line); border-radius:20px; padding:20px; background:var(--bg-1);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head h3{font-family:'Unbounded'; font-size:16px; letter-spacing:0.05em; margin:0; font-weight:600; color:var(--ink);}
  .cal-nav{display:flex; gap:8px;}
  .cal-nav button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:#ffffff;
    color:var(--ink); cursor:pointer; font-size:15px;
  }
  .cal-nav button:hover{border-color:var(--pink); color:var(--pink-soft);}
  .dow-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .dow-row span{text-align:center; font-size:11px; color:var(--ink-faint); font-weight:700; letter-spacing:0.04em;}
  .day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .day-cell{
    aspect-ratio:1/0.95; border-radius:12px; border:1px solid transparent; background:#ffffff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    cursor:pointer; position:relative; font-size:13px; color:var(--ink-dim); transition:border-color .15s, background .15s;
  }
  .day-cell.empty{visibility:hidden; cursor:default;}
  .day-cell:hover{border-color:rgba(219,39,119,0.35);}
  .day-cell.has-event{color:var(--ink); font-weight:700;}
  .dot-row{display:flex; gap:3px;}
  .dot-row .dot{width:5px; height:5px; border-radius:50%;}
  .day-cell.today{border-color:var(--lilac); box-shadow:0 0 0 1px var(--lilac) inset;}
  .day-cell.selected{background:linear-gradient(160deg, rgba(219,39,119,0.12), rgba(124,58,237,0.08)); border-color:var(--pink);}
 
  .detail-card{border:1px solid var(--line); border-radius:20px; padding:20px; background:var(--bg-1); position:sticky; top:84px; min-height:180px;}
  .detail-card h3{font-family:'Unbounded'; font-size:14px; letter-spacing:0.06em; margin:0 0 14px; color:var(--pink-soft);}
  .detail-empty{color:var(--ink-faint); font-size:13.5px; line-height:1.6;}

  /* ---------- LIST ---------- */
  .list-wrap{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:10px;}
  .list-group{display:grid; grid-template-columns:70px 1fr; gap:16px; padding:14px 0; border-top:1px solid var(--line);}
  .list-group:first-child{border-top:none;}
  .list-date{font-family:'Unbounded'; text-align:left;}
  .list-date .d{font-size:26px; font-weight:600; color:var(--ink); line-height:1;}
  .list-date .m{font-size:11px; color:var(--ink-faint); letter-spacing:0.06em;}
  .list-events .event-row{padding:10px 0;}
  .list-empty{color:var(--ink-faint); font-size:14px; text-align:center; padding:30px 0;}
 
  footer{padding:40px 24px 60px; text-align:center; color:var(--ink-faint); font-size:12.5px; border-top:1px solid var(--line); margin-top:20px;}
  footer .word{display:block; margin-bottom:8px; color:var(--ink-dim);}
 
  @media (max-width:560px){
    .navlinks{gap:14px;}
    .navlinks button{font-size:12.5px;}
    .bell-panel{right:12px;}
  }
 
  @media (max-width:480px){
    .navbar{padding:12px 14px; gap:8px;}
    .word{font-size:12.5px; letter-spacing:0.1em;}
    .navlinks{gap:9px;}
    .navlinks button{font-size:11px; padding:5px 1px;}
    .bell-btn{width:34px; height:34px;}
    .hero{padding:40px 14px 18px;}
    .eyebrow{font-size:11px;}
    .hero-spacer{height:16px;}
    .next-chip{font-size:11.5px; padding:8px 12px; gap:8px; text-align:left;}
    .visit-badge{font-size:11px; padding:6px 12px; right:10px; bottom:10px;}
    .group-bar{gap:6px; padding:0 14px 6px;}
    .grp-pill{padding:6px 12px; font-size:12px;}
    section{padding:22px 14px;}
    .section-head{margin-bottom:12px;}
    .today-card, .cal-card, .detail-card{padding:14px;}
    .day-cell{font-size:11px; border-radius:9px;}
    .cal-nav button{width:28px; height:28px; font-size:13px;}
    .event-row{gap:10px;}
    .event-time{width:44px; font-size:11px;}
    .event-body h4{font-size:13.5px; gap:6px;}
    .event-body p{font-size:12px;}
    .list-group{grid-template-columns:52px 1fr; gap:10px;}
    .list-date .d{font-size:22px;}

</style>
</head>

`;

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function groupInfo(id){ return GROUPS.find(g=>g.id===id) || {id, name:id, color:"#888"}; }
function toKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

let activeGroup = "all";
function allEvents(){ return activeGroup==="all" ? EVENTS : EVENTS.filter(e=>e.group===activeGroup); }
function eventsFor(key){ return allEvents().filter(e=>e.date===key).sort((a,b)=>a.time.localeCompare(b.time)); }
function groupsOn(key){
  const ids = [...new Set(EVENTS.filter(e=>e.date===key && (activeGroup==="all"||e.group===activeGroup)).map(e=>e.group))];
  return ids.map(groupInfo);
}

let now = new Date();
let view = {year: now.getFullYear(), month: now.getMonth()};
if(!EVENTS.some(e=>e.date.startsWith(`${view.year}-${String(view.month+1).padStart(2,'0')}`))){
  const first = EVENTS[0].date.split('-');
  view = {year: parseInt(first[0]), month: parseInt(first[1])-1};
}
let selectedKey = null;

function todayKey(){ return toKey(now.getFullYear(), now.getMonth(), now.getDate()); }

function grpTag(e){
  const g = groupInfo(e.group);
  return `<span class="grp-tag" style="--c:${g.color}"><span class="sw"></span>${g.name}</span>`;
}

function renderEventRow(e){
  return `<div class="event-row">
    <div class="event-time">${e.time}</div>
    <div class="event-body">
      <h4>${e.title}${e.isNew?'<span class="new-tag">NEW</span>':''}${grpTag(e)}</h4>
      <p>${e.meta}</p>
    </div>
  </div>`;
}

function renderGroupBar(){
  const bar = document.getElementById('groupBar');
  let html = `<div class="grp-pill ${activeGroup==='all'?'active':''}" data-id="all" style="--c:#ffffff"><span class="sw" style="background:linear-gradient(135deg,var(--pink),var(--lilac))"></span>ทั้งหมด</div>`;
  html += GROUPS.map(g=>`<div class="grp-pill ${activeGroup===g.id?'active':''}" data-id="${g.id}" style="--c:${g.color}"><span class="sw"></span>${g.name}</div>`).join('');
  bar.innerHTML = html;
  bar.querySelectorAll('.grp-pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      activeGroup = p.dataset.id;
      renderAll();
    });
  });
}

function renderToday(){
  document.getElementById('todayDateLabel').textContent =
    now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const evs = eventsFor(todayKey());
  const card = document.getElementById('todayCard');
  if(evs.length===0){
    card.innerHTML = `<div class="today-empty">ไม่มีตารางงานในวันนี้ — ดูงานถัดไปได้ที่ปฏิทินด้านล่าง</div>`;
  } else {
    card.innerHTML = evs.map(renderEventRow).join('');
  }
}

function nextEvent(){
  const nowTime = now.getTime();
  const upcoming = allEvents()
    .map(e=>({...e, ts: new Date(`${e.date}T${e.time}:00`).getTime()}))
    .filter(e=>e.ts >= nowTime)
    .sort((a,b)=>a.ts-b.ts);
  return upcoming[0] || null;
}

function daysUntil(ts){
  const diff = ts - now.getTime();
  const days = Math.round(diff/86400000);
  if(days<=0) return "today";
  if(days===1) return "in 1 day";
  return `in ${days} days`;
}

function renderNextChip(){
  const n = nextEvent();
  const el = document.getElementById('nextChip');
  if(!n){ el.innerHTML = `<span class="cd">No more scheduled events</span>`; return; }
  const g = groupInfo(n.group);
  const d = new Date(n.date);
  const label = d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
  el.style.setProperty('--c', g.color);
  el.innerHTML = `<span class="pulse"></span> Next up · <span style="color:${g.color}; font-weight:700;">${g.name}</span> — <b>${n.title}</b> <span class="cd">· ${label}, ${n.time} · ${daysUntil(n.ts)}</span>`;
}

function renderBell(){
  const nowTime = now.getTime();
  const upcoming = allEvents()
    .map(e=>({...e, ts:new Date(`${e.date}T${e.time}:00`).getTime()}))
    .filter(e=>e.ts>=nowTime)
    .sort((a,b)=>a.ts-b.ts)
    .slice(0,6);
  const list = document.getElementById('bellList');
  document.getElementById('bellDot').style.display = upcoming.length ? 'block' : 'none';
  if(upcoming.length===0){
    list.innerHTML = `<div class="bell-empty">ไม่มีงานที่กำลังจะถึงแล้วในตอนนี้</div>`;
    return;
  }
  list.innerHTML = upcoming.map(e=>{
    const g = groupInfo(e.group);
    const d = new Date(e.date);
    return `<div class="bell-item">
      <div class="bell-date">${MONTH_NAMES[d.getMonth()].slice(0,3)}<b>${d.getDate()}</b></div>
      <div>
        <div class="bell-title">${e.title}${e.isNew?'<span class="new-tag" style="margin-left:6px;">NEW</span>':''}</div>
        <div class="bell-meta"><span style="color:${g.color};">${g.name}</span> · ${e.time} · ${daysUntil(e.ts)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCalendar(){
  document.getElementById('calTitle').textContent = `${MONTH_NAMES[view.month]} ${view.year}`;
  const grid = document.getElementById('dayGrid');
  const firstDow = new Date(view.year, view.month, 1).getDay();
  const daysInMonth = new Date(view.year, view.month+1, 0).getDate();
  let html = '';
  for(let i=0;i<firstDow;i++) html += `<div class="day-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = toKey(view.year, view.month, d);
    const gs = groupsOn(key);
    const isToday = key===todayKey();
    const isSel = key===selectedKey;
    const dots = gs.slice(0,4).map(g=>`<span class="dot" style="background:${g.color}; box-shadow:0 0 5px ${g.color};"></span>`).join('');
    html += `<div class="day-cell ${gs.length?'has-event':''} ${isToday?'today':''} ${isSel?'selected':''}" data-key="${key}">
      <span>${d}</span>${gs.length?`<div class="dot-row">${dots}</div>`:''}
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.day-cell:not(.empty)').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedKey = cell.dataset.key;
      renderCalendar();
      renderDetail();
    });
  });
}

function renderDetail(){
  const body = document.getElementById('detailBody');
  const title = document.querySelector('#detailCard h3');
  if(!selectedKey){
    title.textContent = 'Selected day';
    body.className = 'detail-empty';
    body.innerHTML = 'เลือกวันที่ทางซ้ายเพื่อดูงานในวันนั้น';
    return;
  }
  const d = new Date(selectedKey);
  title.textContent = d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  const evs = eventsFor(selectedKey);
  if(evs.length===0){
    body.className = 'detail-empty';
    body.innerHTML = 'ไม่มีตารางงานในวันนี้';
  } else {
    body.className = '';
    body.innerHTML = evs.map(renderEventRow).join('');
  }
}

function renderList(){
  const dates = [...new Set(allEvents().map(e=>e.date))].sort();
  const wrap = document.getElementById('listWrap');
  if(dates.length===0){
    wrap.innerHTML = `<div class="list-empty">ไม่มีตารางงานของวงนี้</div>`;
    return;
  }
  wrap.innerHTML = dates.map(key=>{
    const d = new Date(key);
    const evs = eventsFor(key);
    return `<div class="list-group">
      <div class="list-date"><div class="d">${d.getDate()}</div><div class="m">${MONTH_NAMES[d.getMonth()].slice(0,3).toUpperCase()}</div></div>
      <div class="list-events">${evs.map(renderEventRow).join('')}</div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderGroupBar();
  renderToday();
  renderNextChip();
  renderBell();
  renderCalendar();
  renderDetail();
  renderList();
}

// ---------- Interactions ----------
document.getElementById('prevMonth').addEventListener('click', ()=>{
  view.month--; if(view.month<0){view.month=11; view.year--;}
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  view.month++; if(view.month>11){view.month=0; view.year++;}
  renderCalendar();
});

const bellBtn = document.getElementById('bellBtn');
const bellPanel = document.getElementById('bellPanel');
bellBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  bellPanel.classList.toggle('open');
});
document.addEventListener('click', (e)=>{
  if(!bellPanel.contains(e.target) && e.target!==bellBtn){ bellPanel.classList.remove('open'); }
});

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth', block:'start'});
  });
});

// ---------- Init ----------
renderAll();
</script>
</body>
</html>
